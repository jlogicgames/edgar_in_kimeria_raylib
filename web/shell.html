  <body>
    <canvas id="canvas" tabindex="-1"></canvas>
    <script>
      const canvas = document.getElementById('canvas');
      const resizeCanvas = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      const Module = { canvas };
    </script>
